# The version, said once: the Windows installer, the Android app and the manual's App info all
# take it from here. 0.1 while most of the application waits to be tried on real dives. `GUI-5`.
release=0.1.0

# The Android platform built against, and the oldest Android that runs the app: 12, where
# Bluetooth has permissions of its own. `AND-2`.
androidSdk=36
androidOldest=31

# Room for Android's dexing, which runs out at Gradle's default of half a gigabyte.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
